openapi: 3.0.3
info:
  title: Vialis Motor
  description: >
    Simula una línea de transporte propuesta: demanda potencial, distancia,
    tiempo de viaje y recaudación potencial. Ver `docs/arquitectura_motor.md`
    para la semántica de cada cálculo.
  version: "1.1.0"
servers:
  - url: http://localhost:8080
    description: Local

paths:
  /lines:
    get:
      operationId: listLines
      summary: Lista las líneas GTFS almacenadas
      description: >
        Devuelve sólo metadata: la geometría de todas las líneas del AMBA en un
        listado pesaría megabytes, así que las paradas y los tramos se piden de
        a una línea con `GET /lines/{id}`.


        Las líneas propias del usuario las persiste otro servicio; acá sólo
        están las que cargó la ETL de GTFS (ver `sql/recorridos/README.md`).
      tags: [lines]
      parameters:
        - name: search
          in: query
          required: false
          description: >
            Coincidencia parcial, sin distinguir mayúsculas, contra la línea, el
            ramal, el nombre público o el destino. Se busca el texto literal:
            `%` y `_` no son comodines.
          schema:
            type: string
          example: "132"
        - name: bbox
          in: query
          required: false
          description: >
            Caja del viewport como `minLon,minLat,maxLon,maxLat` en WGS 84. Se
            queda con las líneas cuya geometría alcanza la caja.
          schema:
            type: string
          example: "-58.6,-34.8,-58.2,-34.4"
        - name: limit
          in: query
          required: false
          description: >
            Cantidad de líneas por página. El valor predeterminado y el máximo
            salen de `config.LinesDefaultPageSize` y `config.LinesMaximumPageSize`; un
            pedido más grande que el máximo se recorta y la respuesta informa el
            `limit` que realmente se aplicó.
          schema:
            type: integer
            minimum: 0
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Una página de líneas y el total de coincidencias.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinePage"
        "400":
          description: Algún parámetro de filtrado o paginación es inválido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: validation_error
                  field: bbox
                  message: "must be minLongitude,minLatitude,maxLongitude,maxLatitude"
        "500":
          description: Error de infraestructura.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /lines/{id}:
    get:
      operationId: getLine
      summary: Devuelve una línea GTFS como ruta simulable
      description: >
        El campo `route` tiene exactamente la forma que acepta `POST
        /simulations`: el cliente lo modifica —agrega, corre o saca paradas, con
        la geometría de cada tramo que toque— y lo manda como `proposed` de
        `POST /comparisons`, usando el original como `baseline`.


        Los nombres de las paradas van en `stops` y no dentro de `route`, porque
        `/simulations` rechaza campos desconocidos y `route` tiene que poder
        reenviarse tal cual.


        `route` no trae `jurisdiction`: GTFS no la registra y el motor no la
        deduce de la geometría, así que la elige quien simula.


        La geometría almacenada se alinea contra sus paradas antes de
        devolverse: la ETL corta el `shape` por fracción, así que el extremo de
        un tramo es la proyección de la parada sobre el recorrido. Sobre el feed
        actual del AMBA esa proyección coincide con la parada y la corrección no
        mueve nada; existe para feeds cuyas paradas no caigan sobre el `shape`
        (ver `config.LinesAlignmentToleranceMeters`).
      tags: [lines]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: La línea con su ruta y el nombre de cada parada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineDetail"
        "400":
          description: El id no es un entero positivo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No hay ninguna línea almacenada con ese id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: not_found
                  field: id
                  message: "no stored line has this id"
        "422":
          description: >
            La línea existe pero su geometría almacenada no describe una ruta
            válida —un hueco entre dos paradas, menos de dos paradas, o un
            extremo demasiado lejos de su parada—. Es un problema de los datos,
            no del pedido: reintentar no cambia nada. No debería ocurrir con el
            feed actual del AMBA; está previsto para no devolver una ruta que
            `POST /simulations` rechazaría.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: line_not_simulable
                  message: "line 12 cannot be simulated: no stored geometry between stops[3] and stops[4]"
        "500":
          description: Error de infraestructura.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /lines/similar:
    post:
      operationId: findSimilarLines
      summary: Busca las líneas almacenadas que comparten corredor con una ruta dibujada
      description: >
        Responde "qué líneas existentes ya pasan por donde dibujé esto" sin
        simular nada. Es el paso previo a `POST /comparisons`: señala la línea o
        dos que vale la pena usar como baseline, y recién ahí conviene pagar el
        costo de una simulación.


        La similitud es solape de corredores medido como cobertura mutua, no
        como intersección: dos trazados sobre la misma avenida, uno dibujado a
        mano y otro venido de un `shape` GTFS, prácticamente nunca se cruzan en
        un punto exacto. Cada línea se mide contra un corredor de
        `config.SimilarityCorridorToleranceMeters` alrededor de la otra, y se
        devuelven los dos números.


        Las dos coberturas nunca se promedian en un único puntaje. Una ruta de
        3 km apoyada entera sobre una línea de 40 km da 1.00 y 0.07, que
        significa "lo que dibujaste es un fragmento de esa línea": un hallazgo
        distinto del de dos líneas que se cubren 0.85 y 0.80, y que un solo
        número borraría.


        El orden va por la menor de las dos coberturas, así que una candidata
        queda arriba sólo cuando se parece en ambos sentidos; los empates se
        resuelven por la cobertura mayor y después por el id de la línea. Las
        candidatas cuya cobertura mayor no alcanza
        `config.SimilarityMinimumCoverage` quedan afuera: por debajo de eso las
        dos líneas apenas se cruzan.


        `route` no lleva `jurisdiction`, a diferencia de `POST /simulations`:
        acá no se calcula ninguna tarifa, así que exigir una autoridad tarifaria
        sólo forzaría un valor sin sentido dentro de una pregunta sobre
        geometría. Una parada también puede omitir su `pathToNext`, que
        `/simulations` exige: en ese caso se toma el segmento recto hasta la
        siguiente, una aproximación razonable del corredor aunque sería una mala
        descripción de un itinerario.
      tags: [lines]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimilarLinesRequest"
      responses:
        "200":
          description: >
            La lista corta y ordenada. Una lista vacía es una respuesta y no una
            falla: ninguna línea almacenada corre por ese corredor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Similarities"
        "400":
          description: >
            Falta la ruta, está malformada o tiene menos de dos paradas, o
            `limit` no es positivo. El `field` indica qué corregir, con las
            mismas rutas de campo que usa `/simulations`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: validation_error
                  field: route.stops
                  message: "must contain at least two stops"
        "504":
          description: La búsqueda superó `config.SimulationTimeout`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Error de infraestructura.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /transfers:
    get:
      operationId: listCombinationRanking
      summary: Lista las combinaciones de líneas más frecuentes
      description: >
        Responde qué pares de colectivos parece estar combinando la gente, y
        cuántos viajes se le atribuyen a cada par. Es el paso previo a proponer
        una línea directa sobre ese flujo.


        Lo que la encuesta SUBE registra acota lo que este endpoint puede
        afirmar. Un viaje es una fila con origen, destino, hora y cantidad de
        etapas: no hay tabla de etapas, ni punto de trasbordo, ni identificador
        de línea. Por eso "este viaje necesitó combinar" se sabe —tuvo más de
        una etapa— y "estas dos líneas lo llevaron" no.


        El ranking salva esa distancia con un supuesto declarado y no con una
        medición: cada flujo origen-destino se reparte en partes iguales entre
        las combinaciones que podrían haberlo servido. Un flujo de 4.000 viajes
        con 4 combinaciones factibles aporta 1.000 a cada una. Por eso
        `averageAlternatives` viaja al lado de cada número y existe
        `weakEvidence`: el mismo valor repartido entre dos candidatos es una
        afirmación fuerte y repartido entre treinta es una conjetura, y nada
        más en la respuesta los distingue.


        Se descarta todo par de celdas que una sola línea ya cubra de punta a
        punta, en el sentido correcto. Si una línea llega del origen al
        destino, ese trasbordo no era obligatorio y el flujo no habla de un
        hueco de red: hablará de frecuencia o de tiempo, que son otras
        preguntas.


        El cálculo entero —el reparto, el descarte y el conteo de
        alternativas— ocurre en `sql/viajes/combinaciones_lineas.sql`, fuera
        del request. Esto es una lectura barata sobre un agregado que ya
        existe, y por eso puede paginar con un total exacto.
      tags: [transfers]
      parameters:
        - name: hour
          in: query
          required: false
          description: >
            Banda horaria, como la informa `vialis.viajes.rango_horario`: la
            hora del día del viaje. Ausente significa el día entero, que es la
            vista por defecto del ranking y una respuesta legítima, no un
            fallback. Un valor presente pero inutilizable se rechaza en vez de
            ensancharse al día, porque un cliente que calcula mal la hora
            recibiría si no una respuesta plausible a la pregunta equivocada.
          schema:
            type: integer
            minimum: 0
            maximum: 23
          example: 9
        - name: limit
          in: query
          required: false
          description: >
            Filas por página. Ausente, se usa
            `config.TransfersDefaultPageSize`; por encima de
            `config.TransfersMaximumPageSize` se recorta a ese máximo.
          schema:
            type: integer
            minimum: 1
          example: 10
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Una página del ranking, de la combinación más grande a la más chica.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferRanking"
        "400":
          description: Parámetro inválido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: validation_error
                  field: hour
                  message: "must be an integer between 0 and 23"
        "504":
          description: La consulta superó `config.SimulationTimeout`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Error de infraestructura.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /simulations:
    post:
      operationId: createSimulation
      summary: Simula una ruta propuesta
      description: >
        Valida la ruta y ejecuta, en el mismo request, la estimación de
        demanda, tiempo de viaje y recaudación potencial.
      tags: [simulations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Route"
            example:
              jurisdiction: caba
              stops:
                - id: "2031665"
                  position:
                    latitude: -34.586005
                    longitude: -58.373625
                  pathToNext:
                    type: LineString
                    coordinates:
                      - [-58.373625, -34.586005]
                      - [-58.373065, -34.586333]
                      - [-58.372657, -34.586333]
                - id: "2031666"
                  position:
                    latitude: -34.58967
                    longitude: -58.36981
      responses:
        "200":
          description: Resultado de la simulación.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationResult"
        "400":
          description: Ruta inválida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: validation_error
                  field: route.jurisdiction
                  message: "must be caba, province, or national"
        "504":
          description: La simulación superó `config.SimulationTimeout`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Error de infraestructura (base de datos, falta de referencias GTFS o de banda tarifaria).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: internal_error
                  message: "estimate travel time: ..."

  /comparisons:
    post:
      operationId: createComparison
      summary: Compara una ruta propuesta contra una existente
      description: >
        Simula ambas rutas y devuelve los dos resultados más la diferencia
        entre ellos. Las dos rutas se envían completas: el motor evalúa rutas,
        no las edita, así que armar la propuesta —incluida la geometría de cada
        tramo modificado— es responsabilidad del cliente.


        Ambas deben declarar la misma jurisdicción: resultados calculados bajo
        cuadros tarifarios distintos no son comparables.
      tags: [simulations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComparisonRequest"
      responses:
        "200":
          description: Ambos resultados y su delta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comparison"
        "400":
          description: >
            Alguna de las rutas es inválida, falta, o las jurisdicciones
            difieren. El `field` indica cuál de las dos rutas falló.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: validation_error
                  field: proposed.stops[3].id
                  message: "must be unique within the route"
        "504":
          description: La comparación superó `config.SimulationTimeout`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Error de infraestructura.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /detours:
    post:
      operationId: createDetour
      summary: Genera y evalúa un desvío temporal
      description: >
        Recibe una ruta completa, un único corte GeoJSON LineString y un
        criterio lexicográfico. Busca caminos dentro de un kilómetro del corte
        con tráfico TomTom actual, reconstruye una variante válida y la compara
        con la ruta original mediante el modelo estable de simulación.


        El tiempo de tráfico sólo decide la variante. Los tiempos contenidos en
        `comparison` siguen siendo estimaciones comerciales GTFS.
      tags: [detours]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DetourRequest"
            example:
              route:
                jurisdiction: caba
                stops:
                  - id: A
                    position: {latitude: -34.6000, longitude: -58.3800}
                    pathToNext:
                      type: LineString
                      coordinates:
                        - [-58.3800, -34.6000]
                        - [-58.3810, -34.6010]
                  - id: B
                    position: {latitude: -34.6010, longitude: -58.3810}
              cut:
                type: LineString
                coordinates:
                  - [-58.3804, -34.6004]
                  - [-58.3806, -34.6006]
              criterion: MENOR_TIEMPO
      responses:
        "200":
          description: Variante completa, paradas no cubiertas, comparación y trazabilidad.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetourResponse"
        "400":
          description: >
            JSON, ruta, corte o criterio inválido; corte fuera del alcance del
            grafo; o límite defensivo de tiles excedido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >
            El pedido es válido pero el corte no afecta la ruta, no coincide
            con una calle, no permite conservar una parada obligatoria o no
            existe un desvío dentro del área local.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: >
            TomTom no está disponible, el snapshot está vencido o su cobertura
            no alcanza para construir un camino con costos actuales.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: El cálculo superó `config.SimulationTimeout`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Error interno de infraestructura o variante generada inválida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    TransferRanking:
      type: object
      description: >
        Una ventana sobre el ranking de combinaciones. A diferencia de
        `Similarities` y como `LinePage`, trae total y offset: el ranking es una
        tabla que se recorre, y precalcularlo es justamente lo que hace que
        contarlo no cueste nada.
      required: [combinations, total, limit, offset, maximumEstimatedTrips]
      properties:
        combinations:
          type: array
          items:
            $ref: "#/components/schemas/Combination"
        hour:
          type: integer
          minimum: 0
          maximum: 23
          description: >
            La banda horaria que describe esta página. Se omite cuando la
            página es del día entero.
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        maximumEstimatedTrips:
          type: number
          format: double
          description: >
            La estimación más grande del ranking completo, no de esta página.
            Es contra lo que un cliente mide la gravedad de cada fila; leerla de
            la página haría que la segunda se pintara contra su propia primera
            fila.

    Combination:
      type: object
      description: Un par de líneas rankeado.
      required:
        [first, second, estimatedTrips, averageAlternatives, weakEvidence,
         peakHour, transfer, topFlows]
      properties:
        first:
          $ref: "#/components/schemas/TransferLeg"
        second:
          $ref: "#/components/schemas/TransferLeg"
        estimatedTrips:
          type: number
          format: double
          description: >
            Volumen atribuido, sumado sobre todos los flujos que esta
            combinación podría servir. Es una estimación bajo el reparto
            descrito arriba, nunca una medición.
        averageAlternatives:
          type: number
          format: double
          description: >
            Entre cuántas combinaciones factibles se repartieron los flujos de
            los que salió ese número, ponderado por volumen. Lo que importa no
            es cuántos flujos aportaron sino cuánta gente.
        weakEvidence:
          type: boolean
          description: >
            Marca una estimación repartida entre tantos candidatos que el par no
            debería leerse como una afirmación. El umbral es
            `config.TransfersWeakEvidenceAlternatives`, y vive en el motor para
            que todos los clientes coincidan en cuándo el motor está dispuesto a
            afirmar algo.
        peakHour:
          type: integer
          minimum: 0
          maximum: 23
        transfer:
          $ref: "#/components/schemas/TransferStop"
        topFlows:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/TransferFlow"

    TransferLeg:
      type: object
      description: Uno de los dos colectivos de la combinación.
      required: [lineId, line, publicName, directionId]
      properties:
        lineId:
          type: integer
          format: int64
          description: >
            `recorridos.id_recorrido`, el mismo id que aceptan `GET /lines/{id}`
            y las comparaciones.
        line:
          type: string
        branch:
          type: string
          description: Se omite cuando la línea no tiene ramal.
        publicName:
          type: string
        directionId:
          type: integer
          enum: [0, 1]

    TransferStop:
      type: object
      description: >
        Dónde la combinación cambia de colectivo. Cuando las dos líneas paran en
        la misma parada física, los dos nombres coinciden y `walkMeters` es 0.
      required: [alightingStopName, boardingStopName, walkMeters, longitude, latitude]
      properties:
        alightingStopName:
          type: string
        boardingStopName:
          type: string
        walkMeters:
          type: integer
          minimum: 0
        longitude:
          type: number
          format: double
          description: Posición de la parada donde se toma el segundo colectivo.
        latitude:
          type: number
          format: double

    TransferFlow:
      type: object
      description: >
        Un movimiento origen-destino atribuido a la combinación. Dice de dónde
        sale la demanda que hay detrás del par de líneas.
      required: [origin, destination, hour, estimatedTrips, alternatives]
      properties:
        origin:
          $ref: "#/components/schemas/TransferCell"
        destination:
          $ref: "#/components/schemas/TransferCell"
        hour:
          type: integer
          minimum: 0
          maximum: 23
        estimatedTrips:
          type: number
          format: double
          description: >
            La parte de este flujo que le tocó a la combinación después del
            reparto, no el volumen entero del flujo: el resto fue a las otras
            combinaciones factibles.
        alternatives:
          type: integer
          minimum: 1
          description: >
            Entre cuántas combinaciones se repartió este flujo. Uno significa
            que la red no dejaba otra forma de hacer ese viaje.

    TransferCell:
      type: object
      description: >
        Celda H3 de resolución 8. No se manda el polígono: un cliente puede
        derivarlo del índice, y repetir siete coordenadas por celda dominaría la
        respuesta.
      required: [h3Index, longitude, latitude]
      properties:
        h3Index:
          type: string
        longitude:
          type: number
          format: double
          description: >
            `hexagonos_viajes.punto_maxima_concurrencia`, que es donde la gente
            de esa celda realmente empieza o termina viajes, no el centro
            geométrico del hexágono.
        latitude:
          type: number
          format: double

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                [
                  validation_error,
                  not_found,
                  line_not_simulable,
                  timeout,
                  invalid_cut,
                  cut_outside_graph,
                  cut_not_matched,
                  route_not_affected,
                  anchor_not_matched,
                  required_stop_not_matched,
                  no_detour_within_search_area,
                  traffic_unavailable,
                  traffic_stale,
                  traffic_coverage_insufficient,
                  traffic_tile_limit_exceeded,
                  internal_error,
                ]
            field:
              type: string
              description: Presente sólo en errores de validación.
            message:
              type: string

    Jurisdiction:
      type: string
      description: Autoridad tarifaria aplicable a la ruta.
      enum: [caba, province, national]

    Position:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180

    LineString:
      type: object
      description: >
        GeoJSON LineString. Las coordenadas van [longitud, latitud]. El
        primer punto debe coincidir con la parada actual y el último con la
        siguiente (tolerancia 20 m); el sentido debe ir de la actual a la
        siguiente.
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [LineString]
        coordinates:
          type: array
          minItems: 2
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: number
              format: double

    Stop:
      type: object
      required: [id, position]
      properties:
        id:
          type: string
          description: Único dentro de la ruta. No necesariamente una parada física distinta (ver rutas circulares).
          minLength: 1
        position:
          $ref: "#/components/schemas/Position"
        pathToNext:
          allOf:
            - $ref: "#/components/schemas/LineString"
          description: Obligatorio en todas las paradas salvo la última, que no debe tenerlo.

    Route:
      type: object
      required: [jurisdiction, stops]
      properties:
        jurisdiction:
          $ref: "#/components/schemas/Jurisdiction"
        stops:
          type: array
          minItems: 2
          items:
            $ref: "#/components/schemas/Stop"

    LineSummary:
      type: object
      description: Una línea GTFS almacenada, sin geometría.
      required: [id, line, publicName, directionId, distanceMeters, stopCount]
      properties:
        id:
          type: integer
          format: int64
        line:
          type: string
          description: Número o nombre de la línea, sin el ramal.
          example: "132"
        branch:
          type: string
          example: TRONCAL
        publicName:
          type: string
        directionId:
          type: integer
          enum: [0, 1]
          description: >
            Sentido GTFS. Cada sentido es una línea distinta acá, porque el
            motor simula una dirección por vez.
        destination:
          type: string
        description:
          type: string
        distanceMeters:
          type: integer
        stopCount:
          type: integer

    LinePage:
      type: object
      required: [lines, total, limit, offset]
      properties:
        lines:
          type: array
          items:
            $ref: "#/components/schemas/LineSummary"
        total:
          type: integer
          description: >
            Coincidencias totales del filtro, no de esta página: alcanza para
            armar el paginador sin recorrerlas.
        limit:
          type: integer
          description: El límite que se aplicó, ya recortado al máximo configurado.
        offset:
          type: integer

    LineStopDescription:
      type: object
      description: >
        El nombre de una parada de la línea. Va acá y no dentro de `route`
        porque `/simulations` rechaza campos desconocidos, y `route` tiene que
        poder reenviarse sin editar. Se corresponde con `route.stops` por orden
        y por id.
      required: [stopOrder, stopId, name]
      properties:
        stopOrder:
          type: integer
          description: Posición de la parada en la ruta, empezando en cero.
        stopId:
          type: string
          description: >
            El `stop_id` de GTFS. Cuando una línea pasa dos veces por la misma
            parada —un recorrido circular termina donde empieza— la repetición
            lleva `#` y su `stop_sequence`, porque `route` exige ids únicos.
        name:
          type: string
        code:
          type: string

    ExportedRoute:
      type: object
      description: >
        Un `Route` sin `jurisdiction`. GTFS no registra qué autoridad tarifaria
        rige una línea y el motor no la deduce de la geometría, así que la elige
        quien simula: hay que agregar el campo antes de mandar esto a `POST
        /simulations`. El resto ya viene con la forma que ese endpoint acepta.
      required: [stops]
      properties:
        stops:
          type: array
          minItems: 2
          items:
            $ref: "#/components/schemas/Stop"

    LineDetail:
      type: object
      required: [line, route, stops]
      properties:
        line:
          $ref: "#/components/schemas/LineSummary"
        route:
          $ref: "#/components/schemas/ExportedRoute"
        stops:
          type: array
          items:
            $ref: "#/components/schemas/LineStopDescription"

    DrawnRoute:
      type: object
      description: >
        Una ruta dibujada para contrastar contra las líneas almacenadas. Es un
        `Route` con dos reglas relajadas, porque una búsqueda de corredores lee
        menos que una simulación: no lleva `jurisdiction`, ya que no se calcula
        ninguna tarifa, y `pathToNext` es opcional, porque una parada sin él se
        une a la siguiente por el segmento recto entre ambas.
      required: [stops]
      properties:
        stops:
          type: array
          minItems: 2
          items:
            $ref: "#/components/schemas/Stop"

    SimilarLinesRequest:
      type: object
      required: [route]
      properties:
        route:
          $ref: "#/components/schemas/DrawnRoute"
        limit:
          type: integer
          minimum: 1
          description: >
            Cuántas coincidencias devolver. Si no se envía, vale
            `config.SimilarityDefaultResultCount`; un pedido mayor se recorta a
            `config.SimilarityMaximumResultCount` y la respuesta informa el
            límite que realmente se aplicó. El cero y los negativos se rechazan
            en vez de leerse como "usá el predeterminado", porque sólo pueden
            ser un cliente calculando mal un tamaño.

    StoredMetrics:
      type: object
      description: >
        Lo que la ETL midió para la línea, tal como está guardado. Salvo la
        distancia, todos los campos son opcionales, porque las columnas son
        nulables y el proyecto no tiene esos datos para todas las líneas. Una
        medición que falta se omite en vez de informarse como cero: "nadie lo
        midió" y "vale cero" no son la misma afirmación.
      required: [distanceMeters]
      properties:
        distanceMeters:
          type: integer
          description: Repite `line.distanceMeters`, para que la medición se lea junta.
        totalMinutes:
          type: integer
          description: Tiempo total de recorrido de la línea.
        passengerFlow:
          type: integer
          description: >
            Caudal de pasajeros registrado. La ETL no documenta un período, así
            que se pasa tal como está guardado, sin convertirlo en una tasa.
        revenue:
          type: integer
          format: int64
          description: >
            `recorridos.ingreso_economico`, sin transformar. No se nombra en
            centavos porque, a diferencia del cuadro tarifario, esa columna no
            declara su unidad.

    Similarity:
      type: object
      description: >
        Una línea almacenada que comparte corredor con la ruta dibujada. Las dos
        coberturas se informan por separado y nunca se promedian: responden
        preguntas distintas, y un solo número borraría justamente la distinción
        entre "lo que dibujaste es un fragmento de esa línea" y "son dos
        versiones de la misma línea".
      required:
        - line
        - coverageOfProposed
        - coverageOfStored
        - originDistanceMeters
        - destinationDistanceMeters
        - metrics
      properties:
        line:
          $ref: "#/components/schemas/LineSummary"
        coverageOfProposed:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: >
            Fracción del largo de la ruta dibujada que corre dentro del corredor
            de la línea almacenada.
        coverageOfStored:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: >
            Fracción del largo de la línea almacenada que corre dentro del
            corredor de la ruta dibujada.
        originDistanceMeters:
          type: number
          format: double
          description: >
            Distancia entre la primera parada de la ruta dibujada y la primera
            de la línea almacenada. Es una señal secundaria: dos líneas pueden
            compartir corredor casi todo su largo y aun así empezar en barrios
            distintos.
        destinationDistanceMeters:
          type: number
          format: double
          description: Lo mismo entre las últimas paradas de cada una.
        metrics:
          $ref: "#/components/schemas/StoredMetrics"

    Similarities:
      type: object
      description: >
        A diferencia de `LinePage`, no trae `total` ni `offset`: es una lista
        corta y ordenada para elegir una baseline, no una ventana que el cliente
        recorre. Pedir más resultados ensancha la misma lista en vez de avanzar
        sobre ella.
      required: [lines, limit]
      properties:
        lines:
          type: array
          items:
            $ref: "#/components/schemas/Similarity"
        limit:
          type: integer
          description: >
            El límite que se aplicó, ya recortado al máximo configurado, para
            poder distinguir una lista corta de una truncada.

    DemandTotals:
      type: object
      properties:
        grossDemand:
          type: number
          format: double
        potentialDemand:
          type: number
          format: double

    Confidence:
      type: string
      enum: [high, medium, low]

    ReferenceSource:
      type: string
      enum: [local_100m, local_300m, local_800m, global]

    TravelTimeTotals:
      type: object
      description: >-
        Commercial time for the whole route under each GTFS scenario.
        Confidence is the worst of any segment, because a route is only as
        trustworthy as its least supported part.
      properties:
        offPeakSeconds:
          type: integer
          format: int64
        typicalSeconds:
          type: integer
          format: int64
        peakSeconds:
          type: integer
          format: int64
        confidence:
          $ref: "#/components/schemas/Confidence"

    RevenueTotals:
      type: object
      properties:
        jurisdiction:
          $ref: "#/components/schemas/Jurisdiction"
        captureFactor:
          type: number
          format: double
          minimum: 0
          maximum: 1
        registeredCardShare:
          type: number
          format: double
          minimum: 0
          maximum: 1
        potentialRevenueCents:
          type: number
          format: double

    MetricsTotals:
      type: object
      properties:
        totalDistanceMeters:
          type: number
          format: double
        travelTime:
          $ref: "#/components/schemas/TravelTimeTotals"

    GlobalResult:
      type: object
      description: Totals for the route as a whole.
      properties:
        demand:
          $ref: "#/components/schemas/DemandTotals"
        revenue:
          $ref: "#/components/schemas/RevenueTotals"
        metrics:
          $ref: "#/components/schemas/MetricsTotals"

    StopDemand:
      type: object
      description: >-
        Demand attributed to one stop. Demand beginning at the stop and demand
        ending there are reported apart because every origin-destination pair
        contributes to both of its stops: adding the two would count each trip
        twice, while each on its own sums to the route total.
      properties:
        originGross:
          type: number
          format: double
        originPotential:
          type: number
          format: double
        destinationGross:
          type: number
          format: double
        destinationPotential:
          type: number
          format: double

    StopRevenue:
      type: object
      description: >-
        Fare revenue attributed to one stop, split the same way and for the
        same reason as StopDemand.
      properties:
        originPotentialCents:
          type: number
          format: double
        destinationPotentialCents:
          type: number
          format: double

    SegmentResult:
      type: object
      description: The ride between two consecutive stops.
      properties:
        distanceMeters:
          type: number
          format: double
        offPeakSeconds:
          type: integer
          format: int64
        typicalSeconds:
          type: integer
          format: int64
        peakSeconds:
          type: integer
          format: int64
        confidence:
          $ref: "#/components/schemas/Confidence"
        source:
          $ref: "#/components/schemas/ReferenceSource"
        referenceRouteCount:
          type: integer

    StopResult:
      type: object
      description: >-
        One stop's part in the route. Every stop is listed, including those
        contributing nothing: showing that a stop carries no demand is what
        makes removing it a defensible decision.
      properties:
        stopOrder:
          type: integer
          description: Position of the stop in the route, starting at zero.
        stopId:
          type: string
        demand:
          $ref: "#/components/schemas/StopDemand"
        revenue:
          $ref: "#/components/schemas/StopRevenue"
        segmentToNext:
          allOf:
            - $ref: "#/components/schemas/SegmentResult"
          nullable: true
          description: >-
            The ride from this stop to the following one, so it is null on the
            last stop, mirroring the pathToNext of the submitted route.

    SimulationResult:
      type: object
      description: >-
        The engine answers on two axes: the route as a whole and each stop's
        part in it. The estimators derive demand and revenue from every
        origin-destination pair, which grows with the square of the stop count;
        that detail stays inside the engine.
      properties:
        global:
          $ref: "#/components/schemas/GlobalResult"
        byStop:
          type: array
          items:
            $ref: "#/components/schemas/StopResult"

    ComparisonRequest:
      type: object
      required: [baseline, proposed]
      properties:
        baseline:
          $ref: "#/components/schemas/Route"
        proposed:
          $ref: "#/components/schemas/Route"

    Change:
      type: object
      description: >-
        Una métrica en ambas versiones y cuánto se movió. `relative` es una
        fracción de la baseline, así que 0.12 significa doce por ciento más.
      properties:
        baseline:
          type: number
          format: double
        proposed:
          type: number
          format: double
        absolute:
          type: number
          format: double
        relative:
          type: number
          format: double
          nullable: true
          description: >-
            Nulo cuando la baseline es cero, porque ahí el cociente no está
            definido: agregar demanda a una ruta que no llevaba ninguna no es
            crecimiento infinito, es una ganancia absoluta y sólo `absolute` la
            describe.

    IntChange:
      type: object
      description: Change para valores contados en unidades enteras.
      properties:
        baseline:
          type: integer
          format: int64
        proposed:
          type: integer
          format: int64
        absolute:
          type: integer
          format: int64
        relative:
          type: number
          format: double
          nullable: true

    ConfidenceChange:
      type: object
      description: >-
        Ambos niveles de confianza, sin restar: son etiquetas ordinales, así
        que la distancia entre dos de ellas no significa nada.
      properties:
        baseline:
          $ref: "#/components/schemas/Confidence"
        proposed:
          $ref: "#/components/schemas/Confidence"

    TravelTimeDelta:
      type: object
      properties:
        offPeakSeconds:
          $ref: "#/components/schemas/IntChange"
        typicalSeconds:
          $ref: "#/components/schemas/IntChange"
        peakSeconds:
          $ref: "#/components/schemas/IntChange"
        confidence:
          $ref: "#/components/schemas/ConfidenceChange"

    Delta:
      type: object
      description: Cuánto movió la propuesta cada métrica de la baseline.
      properties:
        stopCount:
          $ref: "#/components/schemas/IntChange"
        demand:
          type: object
          properties:
            grossDemand:
              $ref: "#/components/schemas/Change"
            potentialDemand:
              $ref: "#/components/schemas/Change"
        revenue:
          type: object
          properties:
            potentialRevenueCents:
              $ref: "#/components/schemas/Change"
        metrics:
          type: object
          properties:
            totalDistanceMeters:
              $ref: "#/components/schemas/Change"
            travelTime:
              $ref: "#/components/schemas/TravelTimeDelta"

    Comparison:
      type: object
      properties:
        baseline:
          $ref: "#/components/schemas/SimulationResult"
        proposed:
          $ref: "#/components/schemas/SimulationResult"
        delta:
          $ref: "#/components/schemas/Delta"

    DetourCriterion:
      type: string
      enum: [MENOR_TIEMPO, MENOR_PARADAS_PERDIDAS]
      description: >
        Objetivo lexicográfico. MENOR_TIEMPO desempata por menos paradas
        perdidas; MENOR_PARADAS_PERDIDAS desempata por menor tiempo de tráfico.

    DetourRequest:
      type: object
      required: [route, cut, criterion]
      additionalProperties: false
      properties:
        route:
          $ref: "#/components/schemas/Route"
        cut:
          allOf:
            - $ref: "#/components/schemas/LineString"
          description: >
            Único corte vigente para esta consulta. No expresa sentido,
            horarios ni fechas y se interpreta como una barrera.
        criterion:
          $ref: "#/components/schemas/DetourCriterion"

    UncoveredStopReason:
      type: string
      enum: [cut_reached, criterion_omission]

    UncoveredStop:
      type: object
      required: [stopOrder, stopId, reason, distanceToCutMeters, baseline]
      properties:
        stopOrder:
          type: integer
          description: Orden de la parada en la ruta original, desde cero.
        stopId:
          type: string
        reason:
          allOf:
            - $ref: "#/components/schemas/UncoveredStopReason"
          description: >
            cut_reached indica que la parada estaba a 20 m o menos del corte y
            era forzosamente inaccesible. criterion_omission indica que estaba
            dentro del radio opcional y el criterio decidió saltearla.
        distanceToCutMeters:
          type: number
          format: double
        baseline:
          allOf:
            - $ref: "#/components/schemas/StopResult"
          description: >
            Aporte que la parada tenía en la simulación original. No es una
            pérdida individual atribuible: la pérdida efectiva está en
            comparison.delta porque la demanda se reasigna en la variante.

    DetourDecisionTrace:
      type: object
      required: [criterion, trafficTravelSeconds]
      properties:
        criterion:
          $ref: "#/components/schemas/DetourCriterion"
        trafficTravelSeconds:
          type: number
          format: double
          description: >
            Tiempo TomTom usado para elegir los caminos locales. No es el tiempo
            comercial GTFS informado por comparison.

    DetourTrafficTrace:
      type: object
      required: [fetchedAt, trafficAgeSeconds, zoom, tileCount, cacheHits]
      properties:
        fetchedAt:
          type: string
          format: date-time
        trafficAgeSeconds:
          type: number
          format: double
          minimum: 0
        zoom:
          type: integer
        tileCount:
          type: integer
          minimum: 1
        cacheHits:
          type: integer
          minimum: 0

    DetourGraphTrace:
      type: object
      required:
        [candidateEdges, blockedEdges, forwardDirectEdges, reverseDirectEdges,
         forwardEstimatedEdges, reverseEstimatedEdges]
      properties:
        candidateEdges:
          type: integer
        blockedEdges:
          type: integer
        forwardDirectEdges:
          type: integer
        reverseDirectEdges:
          type: integer
        forwardEstimatedEdges:
          type: integer
        reverseEstimatedEdges:
          type: integer

    DetourStopTrace:
      type: object
      required: [forced, optional, omitted]
      properties:
        forced:
          type: integer
        optional:
          type: integer
        omitted:
          type: integer

    DetourTrace:
      type: object
      required:
        [decision, graphLoadId, blockedStreetIds, selectedEdgeIds, traffic,
         graph, stops]
      properties:
        decision:
          $ref: "#/components/schemas/DetourDecisionTrace"
        graphLoadId:
          type: integer
          format: int64
        blockedStreetIds:
          type: array
          items:
            type: integer
            format: int64
        selectedEdgeIds:
          type: array
          items:
            type: integer
            format: int64
        traffic:
          $ref: "#/components/schemas/DetourTrafficTrace"
        graph:
          $ref: "#/components/schemas/DetourGraphTrace"
        stops:
          $ref: "#/components/schemas/DetourStopTrace"

    DetourResponse:
      type: object
      required: [variant, uncoveredStops, comparison, trace]
      properties:
        variant:
          $ref: "#/components/schemas/Route"
        uncoveredStops:
          type: array
          items:
            $ref: "#/components/schemas/UncoveredStop"
        comparison:
          $ref: "#/components/schemas/Comparison"
        trace:
          $ref: "#/components/schemas/DetourTrace"
