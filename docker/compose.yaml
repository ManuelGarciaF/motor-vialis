---
services:
  db:
    build:
      context: .
      dockerfile: Dockerfile
    image: vialis-postgres:18-pgrouting
    container_name: vialis-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vialis}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ../sql/init_db.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - ../sql/ddl.sql:/docker-entrypoint-initdb.d/01-ddl.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: "no"

volumes:
  postgres-data:
    external: true
    name: ${POSTGRES_VOLUME:-vialis-postgres-data}
